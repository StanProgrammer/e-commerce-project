name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # ---- Env hygiene: .env.example must match the committed manifest ----
      - name: Env example ↔ manifest sync check
        run: npm run env:check

      # ---- Server (23 Jest+Supertest tests; mocked DB/Redis, no services needed) ----
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Syntax-check server entry point
        working-directory: server
        run: node --check server.js

      # ---- Client (20 Vitest+RTL tests, ESLint, production build) ----
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  # Syncs production env vars to Render + Vercel whenever main is pushed, so
  # providers are updated without touching their dashboards. The local
  # .env.production files are gitignored, so their contents are stored as
  # repository secrets and materialized here before pushing. Missing secrets
  # only warn and skip, keeping the check green until they're configured.
  env-sync:
    name: Sync env to Render + Vercel
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize production env files from secrets
        id: materialize
        shell: bash
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV_PRODUCTION }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV_PRODUCTION }}
        run: |
          if [ -z "$SERVER_ENV" ] || [ -z "$CLIENT_ENV" ]; then
            missing=""
            [ -z "$SERVER_ENV" ] && missing="SERVER_ENV_PRODUCTION"
            [ -z "$CLIENT_ENV" ] && missing="${missing:+$missing, }CLIENT_ENV_PRODUCTION"
            echo "::warning::Env secret(s) not configured yet: $missing. Skipping the env sync — add them to the repository secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SERVER_ENV" > server/.env.production
          printf '%s' "$CLIENT_ENV" > client/.env.production
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Same script as local `npm run env:push`; credentials come from the
      # environment (repository secrets) instead of .env.push. Values are
      # masked in logs. The Render env-vars list endpoint is cursor-paginated
      # (20 per page) and the script reads every page before verifying that all
      # vars persisted, so a successful run means the full list is live.
      - name: Push env vars to Render + Vercel
        if: steps.materialize.outputs.ready == 'true'
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Render/Vercel credentials not configured yet. The env files were materialized but not pushed — add RENDER_API_KEY, RENDER_SERVICE_ID, VERCEL_TOKEN and VERCEL_PROJECT_ID secrets to enable the push."
            exit 0
          fi
          npm run env:push
